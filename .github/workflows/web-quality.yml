name: Web and account quality checks

on:
  push:
    paths:
      - 'web/**'
      - 'supabase/functions/account-delete/**'
      - 'supabase/tests/account_delete_handler.test.mjs'
      - '.github/workflows/web-quality.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'supabase/functions/account-delete/**'
      - 'supabase/tests/account_delete_handler.test.mjs'
      - '.github/workflows/web-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test web data and auth
        working-directory: web
        run: npm test
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Test account deletion boundary
        run: node --test supabase/tests/account_delete_handler.test.mjs
